[project]
name = "mongodb-vector-search"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "krishnendu", email = "krishnendu.panja@sentientgeeks.com" }
]
requires-python = ">=3.13"
dependencies = [
    "edge-tts>=7.3.1",
    "langchain>=1.5.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.8.0",
    "langchain-deepseek>=1.1.1",
    "langchain-google-genai>=4.5.0",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.3",
    "langchain-mongodb>=0.12.1",
    "langchain-openai>=1.8.0",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.22",
    "langsmith>=0.14.17",
    "openai>=3.51.0",
    "pdfplumber>=0.11.10",
    "pip>=26.3",
    "playsound==1.2.2",
    "pyaudio>=0.2.14",
    "pymongo>=4.20.0",
    "pymupdf>=2.1",
    "pypdf>=7.1.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.3.0",
    "speechrecognition>=3.17.0",
    "streamlit>=1.67.0",
    "tqdm>=4.70.1",
]

[project.scripts]
mongodb-vector-search = "mongodb_vector_search:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
